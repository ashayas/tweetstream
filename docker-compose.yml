version: '3.8'

services:
  tweet-stream:
    build: .
    container_name: tweet-stream
    restart: unless-stopped
    ports:
      - "3030:3030"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3030
      - HOST=0.0.0.0
      - TOKEN_STORE_PATH=/app/data/tokens.json
